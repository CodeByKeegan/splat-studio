name: CI

# Client build + CPU-only regression suites on every PR, Dependabot PRs included
# (the automated dependency-merge routine gates on these checks). GPU-only checks
# (collision, WebP render) are skipped on hosted runners via SKIP_GPU=1;
# they still run in local full-suite runs (`npm test` on a GPU machine).
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Build client (typecheck + bundle)
        run: npm run build

      - name: Regression suite (CPU-only)
        run: SKIP_GPU=1 npm test

      - name: MCP e2e suite
        run: npm run test:mcp
